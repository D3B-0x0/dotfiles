# ==========================================
# MODERN TMUX — ZELLIJ CONVERT EDITION
# ==========================================
#
# Cheatsheet (prefix + ? to toggle):
#   Alt+n/c/,      New/close/rename window1
#   Alt+Left/Right Prev/next window
#   Alt+v/s        Split pane h/v
#   Alt+h/j/k/l    Navigate panes
#   Alt+H/J/K/L    Resize pane
#   Alt+z          Zoom pane
#   Alt+f          Floating scratchpad
#   Alt+Space      Session switcher
#   Alt+Enter      Copy mode (v=select, y=yank)
#   prefix+r       Reload config

# --- ENVIRONMENT ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga update-environment " TERM"
set -g focus-events on

# --- BEHAVIOR ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g detach-on-destroy off
set -g escape-time 10
set -g history-limit 50000
set -g display-time 3000
set -g display-panes-time 4000
set -g status-interval 5
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
set -g allow-passthrough on

# --- PREFIX (Zellij-style: C-a) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Help overlay (scrollable, q to quit)
bind ? display-popup -w 70% -h 85% -E "bat --style=plain --paging=always --language=help ~/.config/tmux/cheatsheet.txt"

# ==========================================
# PANE MANAGEMENT
# ==========================================

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H resize-pane -L 10
bind -n M-J resize-pane -D 10
bind -n M-K resize-pane -U 10
bind -n M-L resize-pane -R 10

bind -n M-z resize-pane -Z

bind -n M-Left previous-window
bind -n M-Right next-window

bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-c kill-window
bind -n M-, command-prompt -I "#W" "rename-window -- '%%'"

# Swap windows with prefix bindings
bind S-left swap-window -d -t -1 \; previous-window
bind S-right swap-window -d -t +1 \; next-window

# ==========================================
# FLOATING SCRATCHPAD (like zellij floating)
# ==========================================

bind -n M-f display-popup -w 80% -h 80% -E "tmux attach -t scratch 2>/dev/null || tmux new-session -s scratch"

# ==========================================
# SESSION MANAGEMENT
# ==========================================

bind -n M-Space run "ses=\$(tmux list-sessions -F '#S' | fzf-tmux -p 60%,30% --print-query 2>/dev/null | tail -1); [ -n \"\$ses\" ] && tmux switch-client -t \"\$ses\""

bind -n M-x kill-session

# ==========================================
# COPY MODE (vim keys)
# ==========================================

set -g mode-keys vi
bind -n M-Enter copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ==========================================
# CATPPUCCIN THEME
# ==========================================

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

# Pane styling (like zellij pane frames)
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "top"
set -g @catppuccin_pane_default_fill "number"
set -g @catppuccin_pane_default_text "#{b:pane_current_path}"
set -g @catppuccin_pane_color "#{@thm_teal}"
set -g @catppuccin_pane_background_color "#{@thm_surface_0}"

set -g @plugin 'catppuccin/tmux'

run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status bar (top bar: tabs left, everything else right)
set -g status-position top
set -g status-justify left

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# ==========================================
# TPM PLUGINS
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Resurrect / Continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-save-interval '15'
# Auto-restore is off by default to avoid startup prompts.
# Use prefix + Ctrl-r to restore manually.

# Yank
set -g @yank-selection 'clipboard'
set -g @yank-always-paste-on-click 'on'

run '~/.tmux/plugins/tpm/tpm'
