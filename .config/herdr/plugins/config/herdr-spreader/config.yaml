workspaces:
  - name: Code
    root: ~
    focus: true
    tabs:
      - label: Editor
        panes:
          - command: v
          - split: down
            ratio: 0.7
      - label: Agent
        panes:
          - command: opencode
            focus: true
      - label: Shell
        panes:
          - split: right
            ratio: 0.5
            command: kew 

  - name: Monitor
    root: ~
    tabs:
      - label: Docker
        panes:
          - command: lazydocker
      - label: System
        panes:
          - command: btop
      - label: GPU
        panes:
          - command: nvtop

  - name: Infra
    root: ~
    tabs:
      - label: VPS
        panes:
          - command: ssh -4 vps
