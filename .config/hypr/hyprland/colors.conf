general {
    col.active_border = rgba(6e738dAA)
    col.inactive_border = rgba(24273aAA)
}

misc {
    background_color = rgba(1e2030FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(24273aFF)
        col.text = rgba(cad3f5FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(cad3f5), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(cad3f5), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(cad3f5), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(b7bdf8AA) rgba(b7bdf877),pinned:1
